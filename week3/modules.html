<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules Example: Course and Sections</title>
    <link rel="stylesheet" href="styles/modules.css">
</head>

<body>

    <header>
        <h1>Modules Example: Course and Sections</h1>
    </header>

    <main>
        <h2>Choose a section:</h2>

        <select id="sectionNumber">
            <option value="" disabled selected>-- Choose a section --</option>
        </select>

        <button id="enrollStudent">Enroll a Student</button>
        <button id="dropStudent">Drop a Student</button>

        <table>
            <thead>
                <tr>
                    <th>Section</th>
                    <th>Enrolled</th>
                    <th>Instructor</th>
                </tr>
            </thead>

            <tbody id="sections"></tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 BYU-Idaho</p>
    </footer>

    <script type="module" src="scripts/modules.mjs"></script>

</body>

</html>
